[client]
toolbarMode = "minimal"

[server]
headless = true
runOnSave = true

[theme]
base = "light"
primaryColor = "#0B4A7E"
backgroundColor = "#F8FAFC"
secondaryBackgroundColor = "#EEF3F7"
textColor = "#152536"
linkColor = "#0B4A7E"
borderColor = "#CBD7E2"
dataframeBorderColor = "#CBD7E2"
dataframeHeaderBackgroundColor = "#E5EDF4"
showWidgetBorder = true
showSidebarBorder = true
baseRadius = "8px"
buttonRadius = "8px"
font = "sans-serif"
headingFont = "sans-serif"
baseFontSize = 15
headingFontSizes = ["32px", "24px", "20px", "17px", "15px", "13px"]
headingFontWeights = [700, 650, 600, 600, 600, 600]
linkUnderline = false
greenColor = "#23835B"
redColor = "#C43D3D"
orangeColor = "#F47A16"
yellowColor = "#B08B13"
blueColor = "#2F6F9F"
violetColor = "#7551A8"
grayColor = "#65736B"
chartCategoricalColors = ["#0B4A7E", "#F47A16", "#23835B", "#7551A8", "#C43D3D", "#4E83AC", "#65736B"]
chartSequentialColors = ["#EFF5FA", "#D9E8F3", "#BED8EA", "#98C2DE", "#70A8CE", "#4E8DBB", "#3274A4", "#1E5E8D", "#0B4A7E", "#07385F"]

[theme.sidebar]
backgroundColor = "#082E4D"
secondaryBackgroundColor = "#103F65"
textColor = "#F4F8FB"
borderColor = "#285879"
primaryColor = "#FF8A2B"
